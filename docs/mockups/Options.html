<body>
<div id="dc-root"></div>
<script type="text/x-dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;family=Noto+Sans+JP:wght@500;900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
:root{color-scheme:dark}
body{margin:0;background:#050409}
a{color:inherit}a:hover{color:inherit}
:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}

@keyframes jm-ko{0%,44%{opacity:0}47%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes jm-gh{0%,43.5%{opacity:0}44%{opacity:1;clip-path:inset(12% 0 58% 0);transform:translateX(-6%)}45.5%{opacity:1;clip-path:inset(56% 0 14% 0);transform:translateX(5%)}47%{opacity:1;clip-path:inset(32% 0 38% 0);transform:translateX(-3%)}48%,93.5%{opacity:0}94%{opacity:1;clip-path:inset(60% 0 10% 0);transform:translateX(6%)}95.5%{opacity:1;clip-path:inset(8% 0 62% 0);transform:translateX(-5%)}97%{opacity:1;clip-path:inset(40% 0 30% 0);transform:translateX(3%)}98%,100%{opacity:0}}
@keyframes jm-bar{0%{transform:scaleX(0)}14%,42%{transform:scaleX(1)}47%{transform:scaleX(0)}61%,92%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes jm-flick{0%,43%,48%,93%,98%,100%{opacity:1}44%{opacity:.35}45%{opacity:1}46%{opacity:.6}94%{opacity:.4}95%{opacity:1}96%{opacity:.7}}
@keyframes jm-pulse{0%,100%{opacity:1}50%{opacity:.45}}

</style>
</helmet>
<div style="height: 100vh; overflow: auto; display: flex; flex-wrap: wrap; background-color: {{t.bg}}; background-image: linear-gradient({{t.grid}} 1px, transparent 1px), linear-gradient(90deg, {{t.grid}} 1px, transparent 1px); background-size: 28px 28px; color: {{t.text}}; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 13px; line-height: 1.45">

  <nav aria-label="주 메뉴" style="flex: 0 0 {{side.w}}; box-sizing: border-box; overflow-y: auto; background: {{t.side}}; border-right: 1px solid {{t.line}}; padding: {{side.pad}}; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: {{side.logoDir}}; align-items: center; gap: 10px">

        <span data-anim lang="ja" style="position: absolute; top: 0; right: 0; bottom: 4px; left: 0; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 16px; line-height: 1; color: {{t.text}}; opacity: 0; animation: jm-ja 6s infinite">字</span>
        <span data-anim style="position: absolute; top: 0; right: 0; bottom: 4px; left: 0; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans KR', sans-serif; font-weight: 900; font-size: 16px; line-height: 1; color: {{t.text}}; opacity: 1; animation: jm-ko 6s infinite">자</span>
        <span data-anim style="position: absolute; top: 0; right: 0; bottom: 4px; left: -2px; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans KR', sans-serif; font-weight: 900; font-size: 16px; line-height: 1; color: {{t.bp}}; opacity: 0; animation: jm-gh 6s infinite">자</span>

        </div>
      </sc-if>
      <button type="button" onClick="{{ side.toggle }}" aria-label="{{side.toggleLabel}}" aria-expanded="{{ side.open }}" style="flex: 0 0 auto; width: 28px; height: 28px; padding: 0; border: 1px solid {{t.line}}; border-radius: 4px; background: {{t.field}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer">

          </label>
        </section>

        <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start">

          <section aria-labelledby="tr-h" style="flex: 1 1 420px; min-width: 0; box-sizing: border-box; padding: 14px; background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <h2 id="tr-h" style="margin: 0; font-size: 14px; font-weight: 700">번역</h2>
              <a href="Settings.html" style="font-size: 12px; font-weight: 500; color: {{t.s}}">프로필 관리</a>

            <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
              <legend style="padding: 0; margin-bottom: 6px; font-size: 12px; color: {{t.muted}}">번역 프로필</legend>
              <sc-for list="{{ profiles }}" as="p" hint-placeholder-count="3">

                    <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
                      <span style="font-weight: 700">{{p.name}}</span>
                      <span style="padding: 0 6px; border-radius: 3px; border: 1px solid {{p.kindLine}}; font-size: 11px; font-weight: 500; background: {{p.kindBg}}; color: {{p.kindFg}}">{{p.kind}}</span>
                      <sc-if value="{{ p.isDefault }}" hint-placeholder-val="{{ false }}"><span style="padding: 0 6px; border-radius: 3px; font-size: 11px; font-weight: 700; background: {{t.p}}; color: {{t.pInk}}">기본</span></sc-if>
                    </span>
                    <span style="font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; font-size: 11px; color: {{t.muted}}; overflow-wrap: anywhere">{{p.detail}}</span>
                    <span style="font-size: 11px; color: {{t.muted}}">{{p.note}}</span>
                  </span>
                </label>
              </sc-for>
            </fieldset>
            <sc-if value="{{ isCloud }}" hint-placeholder-val="{{ false }}">
              <div role="note" style="display: flex; gap: 8px; padding: 8px 10px; border-radius: 4px; border: 1px solid {{t.sLine}}; background: {{t.sSoft}}; color: {{t.text}}; font-size: 12px">
                <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.s}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v5h1"></path></svg>
                <span>번역할 <strong>일본어 대사 텍스트</strong>가 Anthropic으로 전송됩니다. 영상과 음성은 전송되지 않습니다. 사용한 토큰과 예상 비용은 진행 화면에 표시됩니다.</span>
              </div>
            </sc-if>
            <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">
              용어집
              <span style="display: flex; gap: 6px">
                <select id="opt-glossary" style="flex: 1 1 auto; min-width: 0; min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}">
                  <option>[작품명] 용어집 · 24개 항목</option>
                  <option>사용 안 함</option>
                </select>
                <button type="button" style="min-height: 32px; padding: 0 12px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: transparent; font: inherit; font-size: 12px; font-weight: 500; color: {{t.text}}; cursor: pointer">편집</button>
              </span>
            </label>
          </section>

          <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
            <section aria-labelledby="stt-h" style="box-sizing: border-box; padding: 14px; background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
              <h2 id="stt-h" style="margin: 0; font-size: 14px; font-weight: 700">음성 인식</h2>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">
                  STT 모델
                  <select id="opt-stt" style="min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}">
                    <option>large-v3 (기본)</option>
                    <option>large-v3-turbo</option>
                    <option>kotoba-whisper-v2.0</option>
                  </select>
                </label>
                <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">
                  오프닝·엔딩 노래 구간
                  <select id="opt-song" style="min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}">
                    <option>가사도 번역</option>
                    <option>건너뛰기</option>
                  </select>
                </label>
              </div>
              <sc-for list="{{ sttFlags }}" as="f" hint-placeholder-count="2">
                <label style="display: flex; gap: 10px; align-items: flex-start; cursor: pointer">
                  <input type="checkbox" checked="{{ f.checked }}" onChange="{{ f.toggle }}" style="margin: 2px 0 0; width: 16px; height: 16px; accent-color: {{t.p}}">
                  <span style="display: flex; flex-direction: column; line-height: 1.35">
                    <span style="font-weight: 500">{{f.label}}</span>
                    <span style="font-size: 11px; color: {{t.muted}}">{{f.help}}</span>
                  </span>
                </label>
              </sc-for>
            </section>

            <section aria-labelledby="out-h" style="box-sizing: border-box; padding: 14px; background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
              <h2 id="out-h" style="margin: 0; font-size: 14px; font-weight: 700">출력</h2>
              <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-wrap: wrap; gap: 4px 16px">
                <legend style="padding: 0; margin-bottom: 4px; font-size: 12px; color: {{t.muted}}">형식</legend>
                <sc-for list="{{ outFlags }}" as="f" hint-placeholder-count="5">
                  <label style="display: flex; gap: 6px; align-items: center; min-height: 26px; cursor: pointer">
                    <input type="checkbox" checked="{{ f.checked }}" onChange="{{ f.toggle }}" style="margin: 0; width: 16px; height: 16px; accent-color: {{t.p}}">
                    <span>{{f.label}}</span>
                  </label>
                </sc-for>
              </fieldset>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid {{t.line}}">
                <span style="display: flex; flex-direction: column; line-height: 1.35">
                  <span style="font-size: 11px; color: {{t.muted}}">저장 위치</span>
                  <span style="font-weight: 500">영상 파일 옆 · episode03.ko.srt</span>
                </span>
                <button type="button" style="min-height: 32px; padding: 0 12px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: transparent; font: inherit; font-size: 12px; font-weight: 500; color: {{t.text}}; cursor: pointer">변경</button>
              </div>
            </section>
          </div>
        </div>

      </div>
    </div>

    <footer aria-label="시스템 모니터" style="flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; min-height: 30px; padding: 4px 16px; box-sizing: border-box; font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; font-size: 11px; color: {{t.muted}}">
      <sc-for list="{{ meters }}" as="m" hint-placeholder-count="4">
        <span style="display: inline-flex; align-items: center; gap: 6px">
          <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 600; letter-spacing: 0.1em; color: {{t.muted}}">{{m.label}}</span>
          <span aria-hidden="true" style="display: inline-block; width: 48px; height: 4px; background: {{t.line}}"><span style="display: block; width: {{m.pct}}; height: 4px; background: {{m.color}}; box-shadow: 0 0 6px {{m.color}}"></span></span>
          <span style="display: inline-block; min-width: {{m.w}}; color: {{t.text}}; font-variant-numeric: tabular-nums">{{m.text}}</span>
        </span>
      </sc-for>
      <span style="margin-left: auto; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 12px">
        <span style="display: inline-flex; align-items: center; gap: 6px; font-family: 'Noto Sans KR', sans-serif; color: {{t.text}}"><span data-anim aria-hidden="true" style="width: 7px; height: 7px; border-radius: 999px; background: {{svcColor}}; box-shadow: 0 0 6px {{svcColor}}; animation: jm-pulse 2s infinite"></span>{{svcText}}</span>
        <span>RTX 4080 · Ryzen 7 7800X3D</span>
      </span>
    </footer>
  </div>
</div>
</script>
<script type="text/x-dc-logic" data-props='{"palette":{"editor":"enum","options":["seoul","acid","ice","blade"],"default":"seoul"},"sidebar":{"editor":"enum","options":["open","hidden"],"default":"open"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tick: 0,
      collapsed: null,
      profile: 'local',
      flags: { vocal: true, filter: true, srt: true, ass: false, vtt: false, ja: false, dual: false }
    };
  }
  componentDidMount() { this._mon = setInterval(() => this.setState({ tick: this.state.tick + 1 }), 2000); }
  componentWillUnmount() { clearInterval(this._mon); }
  theme() {
    const P = {
      seoul: { bg: '#07050F', side: '#0B0817', panel: '#0E0A1C', card: '#141026', field: '#1A1530', line: '#2A2246', lineHi: '#3D3363', text: '#EEEAFF', muted: '#A49CC8', p: '#FF2E97', s: '#00E5FF', pInk: '#14000A', ok: '#3DFF9A', warn: '#FFD43B', err: '#FF773D' },
      acid: { bg: '#040705', side: '#070C08', panel: '#0A100B', card: '#0F1711', field: '#142017', line: '#1F3023', lineHi: '#2E4734', text: '#E8F6E6', muted: '#93AC97', p: '#C6FF1A', s: '#B26BFF', pInk: '#0D1400', ok: '#2AF9D1', warn: '#FDB34C', err: '#FF5468' },
      ice: { bg: '#02060C', side: '#040A13', panel: '#06101C', card: '#0A1626', field: '#0F1D31', line: '#18304B', lineHi: '#244667', text: '#E2F3FF', muted: '#8EA9C4', p: '#2DF0FF', s: '#FF4FD8', pInk: '#001418', ok: '#3DFF9A', warn: '#FFD43B', err: '#FF674C' },
      blade: { bg: '#09080A', side: '#0D0B0D', panel: '#110E10', card: '#181416', field: '#201A1C', line: '#332A2B', lineHi: '#4A3C3C', text: '#F6ECE6', muted: '#B3A39C', p: '#FF7A1A', s: '#19F0D0', pInk: '#1A0A00', ok: '#9AFC63', warn: '#FFDD44', err: '#FF4989' }
    };
    const b = P[this.props.palette] || P.seoul;
    const a = function (h, x) { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + x + ')'; };
    return Object.assign({}, b, {

  monitor(b, t) {
