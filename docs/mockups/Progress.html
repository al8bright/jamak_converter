        bg: on ? t.pSoft : 'transparent', border: on ? t.pLine : 'transparent', fg: on ? t.text : t.muted,
        stroke: on ? t.p : t.muted, fx: on ? t.iconFx : 'none', weight: on ? '700' : '400' };
    };
    return {
      open: !shut,
      toggle: function () { self.setState({ collapsed: !shut }); },
      toggleLabel: shut ? '사이드바 펼치기' : '사이드바 접기',

      groups: [

      ]
    };
  }
  monitor(b, t) {
    const k = this.state.tick;
    const w = function (i) { return Math.sin(k * 1.3 + i * 2.4) * 0.5 + Math.sin(k * 0.7 + i) * 0.5; };
    const clamp = function (v) { return Math.max(0, Math.min(100, v)); };
    const gpu = clamp(b.gpu + b.gpuAmp * w(0));
    const vram = b.vram + 0.15 * w(1);
    const cpu = clamp(b.cpu + b.cpuAmp * w(2));
    const ram = b.ram + 0.2 * w(3);
    const vp = vram / 16 * 100, rp = ram / 31.2 * 100;
    return [
      { label: 'GPU', pct: gpu.toFixed(0) + '%', color: t.p, text: gpu.toFixed(0) + '%', w: '4ch' },
      { label: 'VRAM', pct: vp.toFixed(0) + '%', color: vp >= 85 ? t.warn : t.s, text: vram.toFixed(1) + ' / 16 GB', w: '12ch' },
      { label: 'CPU', pct: cpu.toFixed(0) + '%', color: t.p, text: cpu.toFixed(0) + '%', w: '4ch' },
      { label: 'RAM', pct: rp.toFixed(0) + '%', color: rp >= 85 ? t.warn : t.s, text: ram.toFixed(1) + ' / 31.2 GB', w: '14ch' }
    ];
  }

    const run = { dotBg: t.p, dotFg: t.pInk, dotLine: t.p, dotGlow: t.pGlow, stateFg: t.p, active: true };
    const steps = [
      Object.assign({ no: '1', name: '오디오 추출', detail: 'FFmpeg · 16kHz 모노 · 일본어 트랙 #1', state: '완료 · 0:04' }, done),
      Object.assign({ no: '2', name: '보컬 분리', detail: 'Demucs htdemucs · 끝난 뒤 GPU 메모리 해제', state: '완료 · 1:12' }, done),
      Object.assign({ no: '3', name: '발화 감지', detail: 'Silero VAD · 발화 구간 318개', state: '완료 · 0:03' }, done),
      Object.assign({ no: '4', name: '음성 인식', detail: 'faster-whisper large-v3 · CUDA fp16 · 단어 타임스탬프', state: '완료 · 0:51' }, done),
      Object.assign({ no: '5', name: '자막 단위 분할', detail: '352줄', state: '완료 · 0:01' }, done),
      Object.assign({ no: '6', name: '번역', detail: cloud ? 'claude-opus-5-5 · 묶음 9 / 14 · 동시 요청 4' : 'llama-server · gemma-4-12b-it-qat-q4_0.gguf · 묶음 9 / 14', state: '진행 중 · 64%' }, run),
      Object.assign({ no: '7', name: '자막 쓰기', detail: 'episode03.ko.srt', state: '대기' }, wait)
    ].map(function (s, i) { return Object.assign(s, { line: i === 0 ? 'transparent' : t.line }); });
    const logs = [
      { t: '21:32:04', m: '① audio.wav 추출 완료 (23:52, 16kHz mono)' },
      { t: '21:33:16', m: '② vocals.wav 생성 · Demucs 모델 해제' },
      { t: '21:33:19', m: '③ 발화 구간 318개' },
      { t: '21:34:10', m: '④ 인식 완료 · Whisper 모델 해제' },
      { t: '21:34:11', m: '⑤ 352줄로 분할 → 묶음 14개' }
    ].concat(cloud ? [
      { t: '21:34:12', m: '⑥ claude-opus-5-5 · 동시 요청 4' },
      { t: '21:34:40', m: '⑥ 묶음 6 · 429 → 3초 뒤 재시도' },
      { t: '21:35:02', m: '⑥ 묶음 9 / 14 완료' }
    ] : [
      { t: '21:34:18', m: '⑥ llama-server 준비됨 (port 52811)' },
      { t: '21:35:58', m: '⑥ 묶음 9 / 14 완료' }
    ]).map(function (l) { return Object.assign(l, { tc: t.s }); });
    return {

      svcText: cloud ? 'Claude API · 요청 4개 진행 중' : 'llama-server 실행 중 · :52811',
      isCloud: cloud,

      overallNum: cloud ? 86 : 71,

    };
