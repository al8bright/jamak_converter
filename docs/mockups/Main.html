      groups: [
        { name: '작업', items: [item('home', 'Main.dc.html', '홈', '홈'), item('progress', 'Progress.dc.html', '진행 중인 작업', '진행'), item('review', 'Review.dc.html', '검수·편집', '검수·편집')] },
        { name: '설정', items: [item('engine', 'Settings.dc.html', '번역 엔진', '번역 엔진'), item('system', 'System.dc.html', '시스템 상태', '시스템')] }
      ]
    };
  }
  monitor(b, t) {
    const k = this.state.tick;
    const w = function (i) { return Math.sin(k * 1.3 + i * 2.4) * 0.5 + Math.sin(k * 0.7 + i) * 0.5; };
    const clamp = function (v) { return Math.max(0, Math.min(100, v)); };
    const gpu = clamp(b.gpu + b.gpuAmp * w(0));
    const vram = b.vram + 0.15 * w(1);
    const cpu = clamp(b.cpu + b.cpuAmp * w(2));
    const ram = b.ram + 0.2 * w(3);
    const vp = vram / 16 * 100, rp = ram / 31.2 * 100;
    return [
      { label: 'GPU', pct: gpu.toFixed(0) + '%', color: t.p, text: gpu.toFixed(0) + '%', w: '4ch' },
      { label: 'VRAM', pct: vp.toFixed(0) + '%', color: vp >= 85 ? t.warn : t.s, text: vram.toFixed(1) + ' / 16 GB', w: '12ch' },
      { label: 'CPU', pct: cpu.toFixed(0) + '%', color: t.p, text: cpu.toFixed(0) + '%', w: '4ch' },
      { label: 'RAM', pct: rp.toFixed(0) + '%', color: rp >= 85 ? t.warn : t.s, text: ram.toFixed(1) + ' / 31.2 GB', w: '14ch' }
    ];
  }
  renderVals() {
    const t = this.theme();
    return {
      t: t,
      side: this.sidebar('home', t),
      meters: this.monitor({ gpu: 4, gpuAmp: 2, vram: 1.2, cpu: 8, cpuAmp: 4, ram: 16.9 }, t),
      svcColor: t.ok,
      svcText: '백엔드 연결됨 · 대기 중'
    };
  }
}
</script>
<script src="./dc-lite.js"></script>
</body>
