<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jamak · 설정 · 번역 엔진</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;family=Noto+Sans+JP:wght@500;900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
:root{color-scheme:dark}
body{margin:0;background:#050409}
a{color:inherit}a:hover{color:inherit}
:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
@keyframes jm-ja{0%,44%{opacity:1}47%,94%{opacity:0}97%,100%{opacity:1}}
@keyframes jm-ko{0%,44%{opacity:0}47%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes jm-gh{0%,43.5%{opacity:0}44%{opacity:1;clip-path:inset(12% 0 58% 0);transform:translateX(-6%)}45.5%{opacity:1;clip-path:inset(56% 0 14% 0);transform:translateX(5%)}47%{opacity:1;clip-path:inset(32% 0 38% 0);transform:translateX(-3%)}48%,93.5%{opacity:0}94%{opacity:1;clip-path:inset(60% 0 10% 0);transform:translateX(6%)}95.5%{opacity:1;clip-path:inset(8% 0 62% 0);transform:translateX(-5%)}97%{opacity:1;clip-path:inset(40% 0 30% 0);transform:translateX(3%)}98%,100%{opacity:0}}
@keyframes jm-bar{0%{transform:scaleX(0)}14%,42%{transform:scaleX(1)}47%{transform:scaleX(0)}61%,92%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes jm-flick{0%,43%,48%,93%,98%,100%{opacity:1}44%{opacity:.35}45%{opacity:1}46%{opacity:.6}94%{opacity:.4}95%{opacity:1}96%{opacity:.7}}
@keyframes jm-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){[data-anim]{animation:none !important}}
</style>
</helmet>
<div style="height: 100vh; overflow: auto; display: flex; flex-wrap: wrap; background-color: {{t.bg}}; background-image: linear-gradient({{t.grid}} 1px, transparent 1px), linear-gradient(90deg, {{t.grid}} 1px, transparent 1px); background-size: 28px 28px; color: {{t.text}}; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 13px; line-height: 1.45">

  <nav aria-label="주 메뉴" style="flex: 0 0 {{side.w}}; box-sizing: border-box; overflow-y: auto; background: {{t.side}}; border-right: 1px solid {{t.line}}; padding: {{side.pad}}; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: {{side.logoDir}}; align-items: center; gap: 10px">
      <span data-anim aria-hidden="true" style="position: relative; flex: 0 0 auto; display: inline-block; width: 30px; height: 30px; animation: jm-flick 6s infinite">
        <svg viewBox="0 0 32 32" width="30" height="30" style="position: absolute; inset: 0; overflow: visible; filter: drop-shadow(0 0 3px {{t.bp}})"><path d="M3 11V3h8M29 21v8h-8" fill="none" stroke="{{t.bp}}" stroke-width="2.6" stroke-linecap="square"></path></svg>
        <span data-anim lang="ja" style="position: absolute; top: 0; right: 0; bottom: 4px; left: 0; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 16px; line-height: 1; color: {{t.text}}; opacity: 0; animation: jm-ja 6s infinite">字</span>
        <span data-anim style="position: absolute; top: 0; right: 0; bottom: 4px; left: 0; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans KR', sans-serif; font-weight: 900; font-size: 16px; line-height: 1; color: {{t.text}}; opacity: 1; animation: jm-ko 6s infinite">자</span>
        <span data-anim style="position: absolute; top: 0; right: 0; bottom: 4px; left: -2px; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans KR', sans-serif; font-weight: 900; font-size: 16px; line-height: 1; color: {{t.bp}}; opacity: 0; animation: jm-gh 6s infinite">자</span>
        <span data-anim style="position: absolute; left: 9px; right: 9px; bottom: 5px; height: 2px; background: {{t.bs}}; box-shadow: 0 0 4px {{t.bs}}; transform-origin: left; animation: jm-bar 6s infinite"></span>
      </span>
      <sc-if value="{{ side.open }}" hint-placeholder-val="{{ true }}">
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.15">
          <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.14em; color: {{t.text}}; text-shadow: {{t.bText}}">JAMAK</span>
          <span style="font-size: 10px; color: {{t.muted}}"><span lang="ja" style="font-family: 'Noto Sans JP', sans-serif">字幕</span> → 자막</span>
        </div>
      </sc-if>
      <button type="button" onClick="{{ side.toggle }}" aria-label="{{side.toggleLabel}}" aria-expanded="{{ side.open }}" style="flex: 0 0 auto; width: 28px; height: 28px; padding: 0; border: 1px solid {{t.line}}; border-radius: 4px; background: {{t.field}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM9 5v14"></path><path d="{{side.chevron}}"></path></svg>
      </button>
    </div>
    <sc-for list="{{ side.groups }}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="padding: {{side.groupPad}}; margin-bottom: 2px; font-size: {{side.groupSize}}; text-align: {{side.align}}; color: {{t.muted}}">{{g.name}}</span>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
          <a href="{{it.href}}" aria-current="{{it.current}}" title="{{it.label}}" style="display: flex; flex-direction: {{side.itemDir}}; align-items: center; justify-content: {{side.justify}}; gap: {{side.itemGap}}; min-height: {{side.itemH}}; padding: {{side.itemPad}}; border-radius: 4px; border: 1px solid {{it.border}}; text-decoration: none; color: {{it.fg}}; background: {{it.bg}}; font-size: {{side.itemSize}}; font-weight: {{it.weight}}; line-height: 1.2; text-align: center">
            <svg aria-hidden="true" width="{{side.icon}}" height="{{side.icon}}" viewBox="0 0 24 24" fill="none" stroke="{{it.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; filter: {{it.fx}}"><path d="{{it.d}}"></path></svg>
            <span>{{it.text}}</span>
          </a>
        </sc-for>
      </div>
    </sc-for>
    <span style="margin-top: auto; padding: {{side.groupPad}}; font-family: 'Chakra Petch', sans-serif; font-size: 10px; letter-spacing: 0.1em; text-align: {{side.align}}; color: {{t.muted}}">V0.1.0</span>
  </nav>

  <div style="flex: 999 1 480px; min-width: 0; min-height: 0; display: flex; flex-direction: column">

    <header style="flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; min-height: 50px; padding: 6px 16px; box-sizing: border-box">
      <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.3">
        <span style="font-family: 'Chakra Petch', 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: {{t.s}}">SETTINGS</span>
        <h1 style="margin: 0; font-size: 16px; font-weight: 700">번역 엔진</h1>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
        <nav aria-label="설정 영역" style="display: flex; gap: 2px; padding: 3px; border: 1px solid {{t.line}}; border-radius: 4px; background: {{t.card}}">
          <a href="Settings.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 3px; border: 1px solid {{t.pLine}}; background: {{t.pSoft}}; color: {{t.text}}; text-decoration: none; font-size: 12px; font-weight: 700">번역 엔진</a>
          <a href="System.html" style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 3px; border: 1px solid transparent; color: {{t.muted}}; text-decoration: none; font-size: 12px; font-weight: 500">시스템 상태</a>
        </nav>
        <button type="button" onClick="{{ addNew }}" style="min-height: 32px; padding: 0 14px; border: 0; border-radius: 3px; background: {{t.p}}; color: {{t.pInk}}; font: inherit; font-weight: 700; cursor: pointer; box-shadow: {{t.pGlow}}">+ 프로필 추가</button>
      </div>
    </header>

    <div role="region" aria-label="본문" tabindex="0" style="flex: 1 1 auto; min-height: 0; overflow: auto; margin: 0 10px; border: 1px solid {{t.lineHi}}; border-radius: 6px; background: {{t.panel}}; box-shadow: 0 0 0 1px {{t.pHalo}}, 0 0 40px {{t.pHalo}}">
      <div style="max-width: 1200px; margin: 0 auto; padding: 14px 18px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start">

        <div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 12px">

          <section aria-labelledby="prof-h" style="padding: 12px 14px; background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 6px; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px">
              <h2 id="prof-h" style="margin: 0; font-size: 14px; font-weight: 700">번역 프로필</h2>
              <span style="font-size: 11px; color: {{t.muted}}">작업을 만들 때 기본 프로필이 미리 선택됩니다</span>
            </div>
            <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{ profiles }}" as="p" hint-placeholder-count="3">
                <li style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; border-radius: 4px; border: 1px solid {{p.border}}; background: {{p.bg}}; box-shadow: {{p.shadow}}">
                  <span style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 1px; line-height: 1.35">
                    <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
                      <span style="font-weight: 700">{{p.name}}</span>
                      <span style="padding: 0 6px; border-radius: 3px; border: 1px solid {{p.kindLine}}; font-size: 11px; font-weight: 500; background: {{p.kindBg}}; color: {{p.kindFg}}">{{p.kindLabel}}</span>
                      <sc-if value="{{ p.isDefault }}" hint-placeholder-val="{{ false }}"><span style="padding: 0 6px; border-radius: 3px; font-size: 11px; font-weight: 700; background: {{t.p}}; color: {{t.pInk}}">기본</span></sc-if>
                    </span>
                    <span style="font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; font-size: 11px; color: {{t.muted}}; overflow-wrap: anywhere">{{p.detail}}</span>
                    <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: {{p.statusFg}}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 999px; background: {{p.statusFg}}; box-shadow: 0 0 5px {{p.statusFg}}"></span>{{p.status}}</span>
                  </span>
                  <span style="display: flex; gap: 4px">
                    <sc-if value="{{ p.canDefault }}" hint-placeholder-val="{{ false }}">
                      <button type="button" onClick="{{ p.makeDefault }}" style="min-height: 28px; padding: 0 10px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: transparent; font: inherit; font-size: 12px; color: {{t.text}}; cursor: pointer">기본으로</button>
                    </sc-if>
                    <button type="button" onClick="{{ p.edit }}" style="min-height: 28px; padding: 0 10px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: transparent; font: inherit; font-size: 12px; font-weight: 500; color: {{t.text}}; cursor: pointer">편집</button>
                  </span>
                </li>
              </sc-for>
            </ul>
          </section>

          <section aria-labelledby="keys-h" style="padding: 12px 14px; background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
            <h2 id="keys-h" style="margin: 0; font-size: 14px; font-weight: 700">API 키</h2>
            <div style="border: 1px solid {{t.line}}; border-radius: 4px; overflow-x: auto">
              <table style="width: 100%; min-width: 420px; border-collapse: collapse; text-align: left; font-size: 12px">
                <thead>
                  <tr style="background: {{t.field}}; color: {{t.muted}}; font-size: 11px">
                    <th scope="col" style="padding: 5px 10px; font-weight: 500">제공자</th>
                    <th scope="col" style="padding: 5px 10px; font-weight: 500">이름</th>
                    <th scope="col" style="padding: 5px 10px; font-weight: 500">키</th>
                    <th scope="col" style="padding: 5px 10px; font-weight: 500">등록일</th>
                    <th scope="col" style="padding: 5px 10px; font-weight: 500"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">작업</span></th>
                  </tr>
                </thead>
                <tbody>
                  <tr style="border-top: 1px solid {{t.line}}">
                    <td style="padding: 6px 10px">Anthropic (Claude)</td>
                    <td style="padding: 6px 10px; font-weight: 500">개인 키</td>
                    <td style="padding: 6px 10px; font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; color: {{t.s}}">••••a1b2</td>
                    <td style="padding: 6px 10px; color: {{t.muted}}">2026-11-24</td>
                    <td style="padding: 4px 10px; text-align: right"><button type="button" style="min-height: 26px; padding: 0 8px; border: 1px solid {{t.errLine}}; border-radius: 3px; background: transparent; color: {{t.err}}; font: inherit; font-size: 11px; cursor: pointer">삭제</button></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <form style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px">
              <label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">
                제공자
                <select id="key-provider" style="min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}">
                  <option>Anthropic (Claude)</option>
                  <option>Google (Gemini)</option>
                </select>
              </label>
              <label style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">
                이름
                <input id="key-label" type="text" placeholder="예: 개인 키" style="box-sizing: border-box; min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}">
              </label>
              <label style="flex: 2 1 180px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">
                API 키
                <input id="key-secret" type="password" autocomplete="off" placeholder="붙여 넣기" style="box-sizing: border-box; min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}">
              </label>
              <button type="button" style="min-height: 32px; padding: 0 12px; border: 1px solid {{t.sLine}}; border-radius: 3px; background: {{t.sSoft}}; color: {{t.s}}; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">키 저장</button>
            </form>
            <p style="margin: 0; display: flex; gap: 6px; font-size: 11px; color: {{t.muted}}">
              <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
              <span>키는 현재 Windows 사용자 계정으로 암호화해 이 PC의 설정 파일(jamak.db)에 저장합니다. 저장한 뒤에는 끝 4자리만 볼 수 있습니다.</span>
            </p>
          </section>
        </div>

        <section aria-labelledby="edit-h" style="position: sticky; top: 0; flex: 1 1 360px; min-width: 0; box-sizing: border-box; padding: 12px 14px; background: {{t.card}}; border: 1px solid {{t.pLine}}; border-radius: 6px; box-shadow: 0 0 24px {{t.pHalo}}; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; flex-direction: column; line-height: 1.3">
            <span style="font-family: 'Chakra Petch', 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: {{t.s}}">EDIT PROFILE</span>
            <h2 id="edit-h" style="margin: 0; font-size: 15px; font-weight: 700">{{editName}}</h2>
          </div>

          <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">
            이름
            <input id="pf-name" type="text" value="{{ editName }}" readOnly="{{ true }}" style="box-sizing: border-box; min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}">
          </label>

          <div style="display: flex; flex-direction: column; gap: 3px">
            <span id="kind-l" style="font-size: 12px; color: {{t.muted}}">종류</span>
            <div role="group" aria-labelledby="kind-l" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border: 1px solid {{t.line}}; border-radius: 4px; background: {{t.field}}">
              <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="4">
                <button type="button" aria-pressed="{{ k.on }}" onClick="{{ k.pick }}" style="min-height: 28px; padding: 0 4px; border: 1px solid {{k.border}}; border-radius: 3px; background: {{k.bg}}; color: {{k.fg}}; font: inherit; font-size: 12px; font-weight: {{k.weight}}; cursor: pointer">{{k.label}}</button>
              </sc-for>
            </div>
          </div>

          <sc-if value="{{ isLocal }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 10px">
              <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">
                GGUF 모델 (models 폴더)
                <span style="display: flex; gap: 6px">
                  <select id="pf-gguf" style="flex: 1 1 auto; min-width: 0; min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; font-size: 12px; color: {{t.text}}">
                    <option>gemma-4-12b-it-qat-q4_0.gguf</option>
                  </select>
                  <button type="button" style="min-height: 32px; padding: 0 10px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: transparent; font: inherit; font-size: 12px; color: {{t.text}}; cursor: pointer">파일 추가</button>
                </span>
              </label>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">GPU 레이어<input id="pf-ngl" type="number" value="99" readOnly="{{ true }}" style="box-sizing: border-box; min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}"></label>
                <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">병렬 슬롯<select id="pf-slots" style="min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}"><option>1 (순차)</option><option>2</option><option>4</option></select></label>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ isExternal }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 10px">
              <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">서버 주소 (OpenAI 호환)<input id="pf-url" type="url" value="http://127.0.0.1:11434/v1" readOnly="{{ true }}" style="box-sizing: border-box; min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; font-size: 12px; color: {{t.text}}"></label>
              <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">모델 이름<input id="pf-model-name" type="text" value="local" readOnly="{{ true }}" style="box-sizing: border-box; min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}"></label>
            </div>
          </sc-if>

          <sc-if value="{{ isCloud }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 10px">
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">
                  모델
                  <select id="pf-model" style="min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; font-size: 12px; color: {{t.text}}">
                    <sc-for list="{{ models }}" as="m" hint-placeholder-count="3"><option>{{m}}</option></sc-for>
                  </select>
                </label>
                <label style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: {{t.muted}}">
                  API 키
                  <select id="pf-key" style="min-height: 32px; padding: 0 8px; border: 1px solid {{t.lineHi}}; border-radius: 3px; background: {{t.field}}; font: inherit; font-size: 13px; color: {{t.text}}">
                    <option>{{keyOption}}</option>
                  </select>
                </label>
