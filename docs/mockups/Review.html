<script type="text/x-dc-logic" data-props='{"maxChars":{"editor":"int","min":16,"max":60,"default":30},"palette":{"editor":"enum","options":["seoul","acid","ice","blade"],"default":"seoul"},"sidebar":{"editor":"enum","options":["open","hidden"],"default":"open"},"$preview":{"width":1280,"height":860}}'>

  }
  isCollapsed() {
    return this.state.collapsed !== null ? this.state.collapsed : (this.props.sidebar ?? 'open') === 'hidden';
  }
  sidebar(active, t) {
    const self = this;
    const shut = this.isCollapsed();
    const I = {
      home: 'M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5',
      progress: 'M3 12h4l3-8 4 16 3-8h4',
      review: 'M4 6h16M4 12h10M4 18h7M15 18l2 2 4-4',

      return { href: href, label: label, text: shut ? short : label, d: I[id], current: on ? 'page' : 'false',
        bg: on ? t.pSoft : 'transparent', border: on ? t.pLine : 'transparent', fg: on ? t.text : t.muted,
        stroke: on ? t.p : t.muted, fx: on ? t.iconFx : 'none', weight: on ? '700' : '400' };
    };
    return {
      open: !shut,
      toggle: function () { self.setState({ collapsed: !shut }); },
      toggleLabel: shut ? '사이드바 펼치기' : '사이드바 접기',
      chevron: shut ? 'M13 10l2 2-2 2' : 'M16 10l-2 2 2 2',
      w: shut ? '68px' : '200px', pad: shut ? '12px 6px' : '14px 10px', logoDir: shut ? 'column' : 'row',
      groupPad: shut ? '0' : '0 8px', groupSize: shut ? '10px' : '11px', align: shut ? 'center' : 'left',
      itemDir: shut ? 'column' : 'row', justify: shut ? 'center' : 'flex-start', itemGap: shut ? '3px' : '10px',
      itemH: shut ? '48px' : '34px', itemPad: shut ? '6px 2px' : '0 10px', itemSize: shut ? '10px' : '13px', icon: shut ? 18 : 16,
      groups: [
        { name: '작업', items: [item('home', 'Main.dc.html', '홈', '홈'), item('progress', 'Progress.dc.html', '진행 중인 작업', '진행'), item('review', 'Review.dc.html', '검수·편집', '검수·편집')] },
        { name: '설정', items: [item('engine', 'Settings.dc.html', '번역 엔진', '번역 엔진'), item('system', 'System.dc.html', '시스템 상태', '시스템')] }
      ]
    };
  }
  monitor(b, t) {
    const k = this.state.tick;
    const w = function (i) { return Math.sin(k * 1.3 + i * 2.4) * 0.5 + Math.sin(k * 0.7 + i) * 0.5; };
    const clamp = function (v) { return Math.max(0, Math.min(100, v)); };
    const gpu = clamp(b.gpu + b.gpuAmp * w(0));
    const vram = b.vram + 0.15 * w(1);
    const cpu = clamp(b.cpu + b.cpuAmp * w(2));
    const ram = b.ram + 0.2 * w(3);
    const vp = vram / 16 * 100, rp = ram / 31.2 * 100;
    return [
      { label: 'GPU', pct: gpu.toFixed(0) + '%', color: t.p, text: gpu.toFixed(0) + '%', w: '4ch' },
      { label: 'VRAM', pct: vp.toFixed(0) + '%', color: vp >= 85 ? t.warn : t.s, text: vram.toFixed(1) + ' / 16 GB', w: '12ch' },
      { label: 'CPU', pct: cpu.toFixed(0) + '%', color: t.p, text: cpu.toFixed(0) + '%', w: '4ch' },
      { label: 'RAM', pct: rp.toFixed(0) + '%', color: rp >= 85 ? t.warn : t.s, text: ram.toFixed(1) + ' / 31.2 GB', w: '14ch' }
    ];
  }
  renderVals() {
    const self = this;
    const t = this.theme();
    const max = this.props.maxChars ?? 30;
    const base = [
      { id: 1, time: '00:01:12.340\n00:01:14.120', ja: 'おはよう。今日も早いね', ko: '좋은 아침. 오늘도 일찍 왔네' },
      { id: 2, time: '00:01:14.600\n00:01:16.050', ja: 'だって、約束したでしょ？', ko: '그야, 약속했잖아?' },
      { id: 3, time: '00:01:16.700\n00:01:18.900', ja: 'そんなこと言ったっけ…', ko: '내가 그런 말을 했던가…' },
      { id: 4, time: '00:01:19.200\n00:01:20.800', ja: 'もう、忘れないでよ！', ko: '진짜, 까먹지 좀 마!' },
      { id: 5, time: '00:01:21.400\n00:01:23.650', ja: 'ごめんごめん。じゃあ、行こうか', ko: '미안 미안. 그럼 갈까?' },
      { id: 6, time: '00:01:24.100\n00:01:26.700', ja: '駅前の新しいカフェ、もう行った？', ko: '역 앞에 새로 생긴 카페, 가 봤어?' },
      { id: 7, time: '00:01:27.000\n00:01:29.300', ja: 'まだだけど、ずっと気になってたんだ', ko: '아직 안 가 봤는데, 계속 궁금했어' },
      { id: 8, time: '00:01:29.800\n00:01:34.200', ja: 'じゃあ帰りに寄ってみない？店長さん、昔の知り合いなんだって', ko: '그럼 돌아가는 길에 들러 볼래? 점장님이 예전에 알던 사람이래' },
      { id: 9, time: '00:01:34.700\n00:01:36.300', ja: 'へえ、そうなんだ', ko: '오, 그렇구나' },
      { id: 10, time: '00:01:36.900\n00:01:39.400', ja: 'うん。だから今日は私がおごるね', ko: '응. 그러니까 오늘은 내가 살게' },
      { id: 11, time: '00:01:39.900\n00:01:41.200', ja: 'え、いいの？', ko: '어, 진짜?' },
      { id: 12, time: '00:01:41.600\n00:01:44.000', ja: 'その代わり、宿題手伝ってね', ko: '대신 숙제 좀 도와줘' }
    ];
    const sel = this.state.selected;
    const edits = this.state.edits;
    const locked = this.state.locked;
    let warnCount = 0, lockCount = 0, selectedCount = 0;
    const rows = base.map(function (r) {
      const ko = edits[r.id] !== undefined ? edits[r.id] : r.ko;
      const len = ko.length;
      const warn = len > max;
      const isLocked = !!locked[r.id];
      const isSel = !!sel[r.id];
      if (warn) warnCount++;
      if (isLocked) lockCount++;
      if (isSel) selectedCount++;
      return {
        id: r.id, time: r.time, ja: r.ja, ko: ko, len: len, rows: Math.max(1, Math.ceil(len / 22)),

        rowBg: isSel ? t.pSoft : 'transparent',

        lenFg: warn ? t.warn : t.muted,
        toggle: function () {
          const next = Object.assign({}, self.state.selected);
          next[r.id] = !next[r.id];
          self.setState({ selected: next });
        },
        onEdit: function (e) {
          const ne = Object.assign({}, self.state.edits);
          ne[r.id] = e.target.value;
          const nl = Object.assign({}, self.state.locked);
          nl[r.id] = true;
          self.setState({ edits: ne, locked: nl });
        }
      };
    });
    return {
      t: t,
      side: this.sidebar('review', t),
      meters: this.monitor({ gpu: 3, gpuAmp: 2, vram: 1.2, cpu: 6, cpuAmp: 3, ram: 16.8 }, t),
      svcColor: t.ok,
      svcText: '백엔드 연결됨 · 대기 중',
      rows: rows,
      maxChars: max,
      warnCount: warnCount,
      lockCount: lockCount,
      selectedCount: selectedCount,
      hasSelection: selectedCount > 0,
      clearSel: function () { self.setState({ selected: {} }); }
    };
  }
}
