<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 36 36" width="200" height="200" role="img" aria-labelledby="t">
  <title id="t">jamak 로고: 「 」 안에서 字가 자로 바뀝니다</title>
  <!-- 브랜드 색(고정): 핫핑크 #FF2E97, 시안 #00E5FF. 앱 팔레트를 바꿔도 로고 색은 바꾸지 않는다. -->
  <style>
    .br  { fill: none; stroke: #FF2E97; stroke-width: 2.4; stroke-linecap: square; filter: drop-shadow(0 0 1px #FF2E97) drop-shadow(0 0 3px rgba(255,46,151,.5)); }
    .g   { font-weight: 900; font-size: 16.6px; text-anchor: middle; dominant-baseline: central; }
    .ja  { font-family: 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif; fill: #EEEAFF; }
    .ko  { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #EEEAFF; }
    .ghp { fill: #FF2E97; }
    .ghs { fill: #00E5FF; }
    .bar { fill: #00E5FF; filter: drop-shadow(0 0 1.5px #00E5FF); transform-box: fill-box; transform-origin: left center; }
    .all { animation: flick 6s infinite; }
    .ja  { opacity: 0; animation: ja 6s infinite; }
    .ko  { opacity: 1; animation: ko 6s infinite; }
    .gh  { opacity: 0; animation: gh 6s infinite; }
    .bar { animation: bar 6s infinite; }
    @keyframes ja { 0%,44% { opacity: 1 } 47%,94% { opacity: 0 } 97%,100% { opacity: 1 } }
    @keyframes ko { 0%,44% { opacity: 0 } 47%,94% { opacity: 1 } 97%,100% { opacity: 0 } }
    @keyframes gh {
      0%,43.5% { opacity: 0 }
      44%   { opacity: 1; clip-path: inset(12% 0 58% 0); transform: translateX(-1px) }
      45.5% { opacity: 1; clip-path: inset(56% 0 14% 0); transform: translateX(.8px) }
      47%   { opacity: 1; clip-path: inset(32% 0 38% 0); transform: translateX(-.5px) }
      48%,93.5% { opacity: 0 }
      94%   { opacity: 1; clip-path: inset(60% 0 10% 0); transform: translateX(1px) }
      95.5% { opacity: 1; clip-path: inset(8% 0 62% 0); transform: translateX(-.8px) }
      97%   { opacity: 1; clip-path: inset(40% 0 30% 0); transform: translateX(.5px) }
      98%,100% { opacity: 0 }
    }
    @keyframes bar { 0% { transform: scaleX(0) } 14%,42% { transform: scaleX(1) } 47% { transform: scaleX(0) } 61%,92% { transform: scaleX(1) } 97%,100% { transform: scaleX(0) } }
    @keyframes flick { 0%,43%,48%,93%,98%,100% { opacity: 1 } 44% { opacity: .35 } 45% { opacity: 1 } 46% { opacity: .6 } 94% { opacity: .4 } 95% { opacity: 1 } 96% { opacity: .7 } }
    @media (prefers-reduced-motion: reduce) { .all, .ja, .ko, .gh, .bar { animation: none } }
  </style>
  <g class="all">
    <path class="br" d="M3 11V3h8M29 21v8h-8"/>
    <text class="g ja" x="16" y="13.9">字</text>
    <text class="g ko" x="16" y="13.9">자</text>
    <g class="gh"><text class="g ko ghp" x="15" y="13.9" style="opacity:1;animation:none">자</text></g>
    <g class="gh"><text class="g ja ghs" x="17" y="13.9" style="opacity:1;animation:none">字</text></g>
    <rect class="bar" x="9.3" y="25.9" width="13.4" height="1.3" rx=".2"/>
  </g>
</svg>
