[project]
name = "jamak"
version = "0.1.0"
description = "Local Japanese -> Korean subtitle generator (faster-whisper + llama.cpp)"
readme = "README.md"
authors = [
    { name = "Ethan", email = "al8bright@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "fastapi>=0.165.0",
    "faster-whisper>=1.2.1",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "psutil>=7.2.2",
    "pydantic>=2.14.4",
    "pysubs2>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# vocal separation (Demucs) needs PyTorch (~2.5 GB): uv sync --extra separation
separation = [
    "demucs>=4.1.0",
    "torch>=2.14",
]

[project.scripts]
jamak = "jamak:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pyopenjtalk-plus>=0.4.1.post10",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.uv]
# the app targets Windows (Tauri + CUDA); don't resolve for other platforms
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
